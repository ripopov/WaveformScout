[package]
name = "rjets"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
eframe = "0.29"
egui = "0.29"
anyhow = "1.0"
rfd = "0.15"

[[bin]]
name = "jets-gui"
path = "src/main.rs"

[[bin]]
name = "jets-tracegen"
path = "src/tracegen.rs"

[lib]
name = "rjets"
path = "src/lib.rs"
